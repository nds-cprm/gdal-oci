name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      dispatch-derived:
        description: After publishing the tags, start the CI of the derived images (dispatch job)
        type: boolean
        default: true
  # weekly rebuild, so the images pick up the Debian/Python fixes of the base images
  # (scheduled runs only happen on the default branch)
  schedule:
  - cron: "0 3 * * 1"
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]

# least privilege for the GITHUB_TOKEN; jobs that need more ask for it
permissions:
  contents: read

env:
  IMAGE: docker.io/ndscprm/gdal

# Actions are pinned by commit SHA (the comment is the release); Dependabot keeps them up to date
jobs:
  # One job per architecture on native runners. Images are pushed by digest only (no tag);
  # the merge job assembles the multi-platform tags from those digests.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
        - arch: amd64
          runner: ubuntu-24.04
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # build-push-action uploads a build record (.dockerbuild, for the Docker Desktop Builds view) per build;
      # 14 days keeps the current and the previous weekly run instead of the 90-day default
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 14
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # devel first (toolchain, headers, GDAL sources and debug symbols; Arrow and GDAL take most of the time);
    # release-py and release-nopy reuse the devel stage from the same builder, so all come from the same GDAL build
    - name: Build and push devel image
      id: devel
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile
        platforms: linux/${{ matrix.arch }}
        # Always attempt to pull all referenced images
        pull: true
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        target: devel
        cache-from: type=gha,scope=${{ matrix.arch }}
        # SBOM (Debian/Python packages + the CycloneDX files in /opt/geosgb/share/sbom) and provenance
        # attestations, kept by imagetools create in the multi-platform tags
        sbom: true
        provenance: mode=max

    # the release-py build goes through devel and staging, so its mode=max cache covers every stage
    # (a cache-to on the devel step would only duplicate it in the 10 GB GHA cache)
    - name: Build and push release-py image
      id: release-py
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile
        platforms: linux/${{ matrix.arch }}
        # Always attempt to pull all referenced images
        pull: true
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        target: release-py
        cache-from: type=gha,scope=${{ matrix.arch }}
        cache-to: type=gha,scope=${{ matrix.arch }},mode=max
        # the release-py stage (apt-get install of the runtime packages) is always rebuilt, so every run gets
        # the current Debian fixes even when the cached layers did not change; it takes a couple of minutes
        no-cache-filters: release-py
        sbom: true
        provenance: mode=max

    # same GDAL runtime without Python (debian slim base, no venv); devel and staging come from the cache
    # written by the release-py step, and the release-nopy stage is always rebuilt like release-py
    - name: Build and push release-nopy image
      id: release-nopy
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: Dockerfile
        platforms: linux/${{ matrix.arch }}
        # Always attempt to pull all referenced images
        pull: true
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        target: release-nopy
        cache-from: type=gha,scope=${{ matrix.arch }}
        no-cache-filters: release-nopy
        sbom: true
        provenance: mode=max

    # runs on the native runner of each architecture; a failure here stops the scan and merge jobs,
    # so no tag is created for a broken image
    - name: Smoke test devel, release-py and release-nopy images
      env:
        DEVEL_DIGEST: ${{ steps.devel.outputs.digest }}
        RELEASE_PY_DIGEST: ${{ steps.release-py.outputs.digest }}
        RELEASE_NOPY_DIGEST: ${{ steps.release-nopy.outputs.digest }}
      run: |
        sh .github/scripts/smoke-test.sh "${IMAGE}@${RELEASE_PY_DIGEST}"
        sh .github/scripts/smoke-test.sh "${IMAGE}@${DEVEL_DIGEST}"
        sh .github/scripts/smoke-test.sh "${IMAGE}@${RELEASE_NOPY_DIGEST}" release-nopy

    - name: Export digests
      env:
        DEVEL_DIGEST: ${{ steps.devel.outputs.digest }}
        RELEASE_PY_DIGEST: ${{ steps.release-py.outputs.digest }}
        RELEASE_NOPY_DIGEST: ${{ steps.release-nopy.outputs.digest }}
      run: |
        mkdir -p "${{ runner.temp }}/digests/devel" "${{ runner.temp }}/digests/release-py" "${{ runner.temp }}/digests/release-nopy"
        touch "${{ runner.temp }}/digests/devel/${DEVEL_DIGEST#sha256:}"
        touch "${{ runner.temp }}/digests/release-py/${RELEASE_PY_DIGEST#sha256:}"
        touch "${{ runner.temp }}/digests/release-nopy/${RELEASE_NOPY_DIGEST#sha256:}"

    - name: Upload digests
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  # Scans the release-py and release-nopy images of each architecture before any tag exists. Gate: a Critical vulnerability
  # with an available fix that is not covered by vex/gdal-oci.openvex.json fails the job, so merge does not run.
  # Everything else (High, unfixed Debian CVEs) only goes to code scanning.
  scan:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: [release-py, release-nopy]
    env:
      # SARIF categories: docker-scout-<arch> / grype-<arch> for release-py (unchanged, keeps the code scanning history),
      # ...-nopy-<arch> for release-nopy
      CATEGORY_SUFFIX: ${{ matrix.variant == 'release-nopy' && 'nopy-' || '' }}${{ matrix.arch }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # upload of the SARIF reports to code scanning
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # Docker Scout requires a Docker Hub login
    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Docker Scout ignores the components built from source (GDAL, Arrow, Thrift, ...): they only have
    # generic purls. Grype matches them by CPE, but scanning the image directly skips the CycloneDX files
    # in /opt/geosgb/share/sbom; the BuildKit SBOM attestation already includes them, so Grype scans it
    - name: Get the SBOM attestation of the ${{ matrix.variant }} image
      id: sbom
      working-directory: ${{ runner.temp }}/digests/${{ matrix.variant }}
      run: |
        ref="${IMAGE}@sha256:$(ls)"
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"
        # single-platform image: {"SPDX": ...}; keyed by platform otherwise
        docker buildx imagetools inspect "$ref" --format '{{ json .SBOM }}' \
          | jq -e 'if has("SPDX") then .SPDX else (to_entries[0].value.SPDX) end' > "${GITHUB_WORKSPACE}/image.spdx.json"
        grep -q '"name": *"thrift"' "${GITHUB_WORKSPACE}/image.spdx.json"

    - name: Analyze with Docker Scout
      uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
      with:
        command: cves
        image: ${{ steps.sbom.outputs.ref }}
        platform: linux/${{ matrix.arch }}
        sarif-file: scout.sarif
        summary: true

    - name: Upload Docker Scout SARIF result
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: scout.sarif
        category: docker-scout-${{ env.CATEGORY_SUFFIX }}

    # full report (all severities, fixed or not) for code scanning
    - name: Analyze with Grype
      id: grype
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        sbom: image.spdx.json
        vex: vex/gdal-oci.openvex.json
        fail-build: false
        output-format: sarif

    - name: Upload Grype SARIF result
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.grype.outputs.sarif }}
        category: grype-${{ env.CATEGORY_SUFFIX }}

    # the gate itself, after the reports are uploaded so they are visible even when it fails
    - name: Fail on fixable critical vulnerabilities
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        sbom: image.spdx.json
        vex: vex/gdal-oci.openvex.json
        only-fixed: true
        severity-cutoff: critical
        fail-build: true
        output-format: table

  # Creates the multi-platform tags: <GDAL_VERSION>-py<PYTHON_VERSION>[-devel] and <GDAL_VERSION>-nopy (moving,
  # always the latest build) and the dated ones, <moving tag>-<YYYYMMDD> (one per build, never overwritten)
  merge:
    needs: [build, scan]
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # tag policy: <GDAL_VERSION>-py<PYTHON_VERSION>[-devel] and <GDAL_VERSION>-nopy, from the ARG defaults in the Dockerfile
    - name: Get image tags from the Dockerfile
      id: meta
      run: |
        GDAL_VERSION=$(sed -n 's/^ARG GDAL_VERSION=//p' Dockerfile)
        PYTHON_VERSION=$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile)
        test -n "$GDAL_VERSION" && test -n "$PYTHON_VERSION"
        TAG="${GDAL_VERSION}-py${PYTHON_VERSION}"
        echo "release_py=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
        echo "devel=${IMAGE}:${TAG}-devel" >> "$GITHUB_OUTPUT"
        echo "release_nopy=${IMAGE}:${GDAL_VERSION}-nopy" >> "$GITHUB_OUTPUT"

    - name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create multi-platform tags
      env:
        DEVEL_TAG: ${{ steps.meta.outputs.devel }}
        RELEASE_PY_TAG: ${{ steps.meta.outputs.release_py }}
        RELEASE_NOPY_TAG: ${{ steps.meta.outputs.release_nopy }}
      working-directory: ${{ runner.temp }}/digests
      run: |
        # dated tag, never overwritten: a second build on the same day gets .2, .3, ...
        STAMP=$(date -u +%Y%m%d)
        suffix=$STAMP
        n=1
        while docker buildx imagetools inspect "${RELEASE_PY_TAG}-${suffix}" > /dev/null 2>&1; do
          n=$((n + 1))
          suffix="${STAMP}.${n}"
        done
        for variant in devel release-py release-nopy; do
          case "$variant" in
            devel) tag=$DEVEL_TAG ;;
            release-py) tag=$RELEASE_PY_TAG ;;
            release-nopy) tag=$RELEASE_NOPY_TAG ;;
          esac
          dated="${tag}-${suffix}"
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$tag" -t "$dated" $(printf "${IMAGE}@sha256:%s " $(ls "$variant"))
          docker buildx imagetools inspect "$dated"
        done
        echo "Tags datadas: \`${RELEASE_PY_TAG}-${suffix}\`, \`${DEVEL_TAG}-${suffix}\` e \`${RELEASE_NOPY_TAG}-${suffix}\`" >> "$GITHUB_STEP_SUMMARY"

  # Starts the CI (docker-image.yml, workflow_dispatch) of the images built on ndscprm/gdal, now that the
  # moving tags point to the new build. The GITHUB_TOKEN cannot start workflows in other repositories:
  # DERIVED_IMAGES_TOKEN is a fine-grained token (or GitHub App token) with "Actions: read and write" on
  # those repositories only. Without it the job only warns, so the base image publication is not affected
  dispatch:
    needs: merge
    if: github.event_name == 'schedule' || inputs.dispatch-derived
    strategy:
      fail-fast: false
      matrix:
        repository: [mapserver-oci, mapproxy-oci, pygeoapi-oci]
    runs-on: ubuntu-24.04
    # nothing of the GITHUB_TOKEN is used
    permissions: {}
    steps:
    - name: Start the CI of ${{ matrix.repository }}
      env:
        GH_TOKEN: ${{ secrets.DERIVED_IMAGES_TOKEN }}
        REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repository }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::warning::DERIVED_IMAGES_TOKEN is not set: ${REPOSITORY} was not started"
          exit 0
        fi
        gh workflow run docker-image.yml --repo "$REPOSITORY" --ref main
        echo "CI de \`${REPOSITORY}\` disparado" >> "$GITHUB_STEP_SUMMARY"
