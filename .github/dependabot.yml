version: 2
updates:
# keeps the SHA-pinned actions of the workflows up to date (the version comment is updated too)
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    github-actions:
      patterns: ["*"]

# keeps the hashed virtualenv pins (requirements/*.in -> *.txt, pip-compile) up to date.
# numpy is pinned in gdal-build.in and pyarrow-build.in, which must agree (pyarrow-build.in has
# "-c gdal-build.in"): a PR changing only one of them would break the build, so numpy is updated by hand,
# in both files at once (see the comments in the .in files); its CVEs still show up in the CI scan
- package-ecosystem: pip
  directory: /requirements
  schedule:
    interval: weekly
  ignore:
  - dependency-name: numpy
  groups:
    venv:
      patterns: ["*"]
