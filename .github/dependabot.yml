version: 2
updates:
# keeps the SHA-pinned actions of the workflows up to date (the version comment is updated too)
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    github-actions:
      patterns: ["*"]

# keeps the hashed virtualenv pins (requirements/venv.in -> venv.txt, pip-compile) up to date;
# a numpy major upgrade needs care (see the comment in venv.in)
- package-ecosystem: pip
  directory: /requirements
  schedule:
    interval: weekly
  groups:
    venv:
      patterns: ["*"]
